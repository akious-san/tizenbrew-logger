<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Runtime Identity</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #101820; color: #f2f5f7; font: 24px Arial, sans-serif; }
        main { max-width: 1600px; margin: 32px auto; padding: 0 40px; }
        h1 { margin: 0 0 12px; font-size: 44px; }
        p { margin: 10px 0 20px; line-height: 1.4; }
        .muted { color: #bbc8d0; }
        button { padding: 12px 28px; margin-bottom: 16px; font: inherit; color: #101820; background: #b1ecdf; border: 3px solid transparent; border-radius: 6px; }
        button:focus { outline: 4px solid #ffffff; outline-offset: 4px; }
        button:disabled { background: #738982; }
        #status { min-height: 34px; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { padding: 10px 14px; border-bottom: 1px solid #3a4a55; text-align: left; vertical-align: top; }
        th { color: #bbc8d0; font-size: 21px; }
        td:first-child { width: 25%; }
        td:nth-child(2) { width: 15%; }
        td:last-child { word-break: break-word; }
        .observed { color: #b1ecdf; }
        .unavailable { color: #e3cc91; }
        .error { color: #f3b3b3; }
        .note { font-size: 20px; color: #bbc8d0; }
    </style>
</head>
<body>
    <main>
        <h1>Runtime Identity</h1>
        <p class="muted">The account and runtime used by TizenBrew's background service.</p>
        <button id="refresh" type="button">Refresh report</button>
        <p id="status" role="status" aria-live="polite">Waiting to read the report.</p>
        <p id="timestamp" class="note"></p>
        <table id="report-table" hidden>
            <thead><tr><th scope="col">Evidence</th><th scope="col">Status</th><th scope="col">Observed value or reason</th></tr></thead>
            <tbody id="observations"></tbody>
        </table>
        <p class="note">UID and GID describe the service process. Permission to run commands or change protected system files is not measured here.</p>
    </main>
    <script src="main.js"></script>
</body>
</html>
